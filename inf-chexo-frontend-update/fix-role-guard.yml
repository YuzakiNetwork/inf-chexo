name: Fix student RoleGuard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch RoleGuard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('app/siswa/page.tsx')
          text = page.read_text()
          if "@/components/RoleGuard" not in text:
              text = text.replace("import { supabase } from '@/lib/supabase';", "import { supabase } from '@/lib/supabase';\nimport RoleGuard from '@/components/RoleGuard';", 1)
              page.write_text(text)

          guard = Path('components/RoleGuard.tsx')
          guard.parent.mkdir(parents=True, exist_ok=True)
          if not guard.exists():
              guard.write_text('''\'use client\';\n\nimport { useEffect, useState } from \'react\';\nimport { useRouter } from \'next/navigation\';\nimport { supabase } from \'@/lib/supabase\';\n\ntype Role = \'student\' | \'teacher\' | \'administrator\';\n\nconst portalByRole: Record<Role, string> = {\n  student: \'/siswa\',\n  teacher: \'/guru\',\n  administrator: \'/admin\',\n};\n\nexport default function RoleGuard({ role, children }: { role: Role; children: React.ReactNode }) {\n  const router = useRouter();\n  const [allowed, setAllowed] = useState(false);\n\n  useEffect(() => {\n    let active = true;\n    (async () => {\n      if (!supabase) {\n        router.replace(\'/login\');\n        return;\n      }\n\n      const { data: { user } } = await supabase.auth.getUser();\n      if (!user) {\n        router.replace(\'/login\');\n        return;\n      }\n\n      const { data: profile } = await supabase\n        .from(\'profiles\')\n        .select(\'role\')\n        .eq(\'id\', user.id)\n        .maybeSingle();\n\n      const userRole = profile?.role as Role | null;\n      if (userRole !== role) {\n        router.replace(userRole && portalByRole[userRole] ? portalByRole[userRole] : \'/login\');\n        return;\n      }\n\n      if (active) setAllowed(true);\n    })();\n\n    return () => { active = false; };\n  }, [role, router]);\n\n  if (!allowed) return null;\n  return <>{children}</>;\n}\n''')

          if text == page.read_text() and guard.exists():
              print('RoleGuard already patched')
          else:
              print('RoleGuard patched')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/siswa/page.tsx components/RoleGuard.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix(auth): add missing student RoleGuard"
          git push
